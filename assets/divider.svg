<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 12" width="1000" height="12" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="d" gradientUnits="objectBoundingBox" spreadMethod="reflect" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#00f5ff" stop-opacity="0"/>
      <animate attributeName="x1" values="0%;200%" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;300%" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="g" x="-50%" y="-500%" width="200%" height="1100%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="5" width="1000" height="2" rx="1" fill="#1b2540"/>
  <rect x="0" y="5" width="1000" height="2" rx="1" fill="url(#d)"/>
  <circle cy="6" r="3.5" fill="#00f5ff" filter="url(#g)">
    <animate attributeName="cx" values="-10;1010" dur="4s" repeatCount="indefinite"/>
  </circle>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
